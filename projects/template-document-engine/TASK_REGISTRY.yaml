project: template-document-engine
version: 0.1-blueprint
status_values: [TODO, READY, IN_PROGRESS, BLOCKED, DONE]
done_requires: [implementation_files, tests, test_result, commit_sha_or_worktree_diff, evidence_notes]
rules:
  - depends_on must be DONE before starting
  - DETERMINISTIC nodes must not call LLM
  - LLM nodes must use Local LLM Gateway
  - HYBRID nodes use bounded LLM proposal plus deterministic validation
  - preserve UNKNOWN/REVIEW; never invent certainty
  - DONE requires all acceptance criteria from architecture/acceptance docs plus node-specific tests
